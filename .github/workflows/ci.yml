name: China Data Atlas CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  data-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python data dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install duckdb pandas pyarrow beautifulsoup4 lxml requests pytest
      - name: Run Data Quality Gate & Pytest
        run: |
          .venv/bin/python pipeline/validation/quality_gate.py
          .venv/bin/pytest -v tests/data/test_observations.py

  web-build-and-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, Unit Tests, and Production Build
        run: |
          npm run typecheck
          npm run test:unit
          npm run build
